<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern and Contemporary Art — lecture decks</title>
<meta name="description" content="Interactive lecture decks for a college art-history course. English at CEFR A2, with Chinese glosses.">
<link rel="stylesheet" href="shared/style.css">
</head>
<body class="course">

<main class="course-page">
  <header>
    <div class="course-kicker">Lecture decks</div>
    <h1>Modern and Contemporary Art</h1>
    <p class="course-sub">
      English at CEFR A2, with Chinese on the key vocabulary.
      Open a week, then press <b>P</b> for the presenter window and
      <b>M</b> to jump to a section.
    </p>
  </header>

  <ul class="weeks" id="weeks"></ul>

  <footer class="course-foot">
    Built from Vicky’s slides and lesson plans.
  </footer>
</main>

<script src="weeks.js"></script>
<script>
document.getElementById('weeks').innerHTML = WEEKS.map(w => {
  const inner = `
    <span class="wk">Week ${w.n}</span>
    <span class="wk-title">${w.title || 'Not built yet'}</span>
    ${w.q ? `<span class="wk-q">${w.q}</span>` : ''}
    ${w.meta ? `<span class="wk-meta">${w.meta}</span>` : ''}`;
  return w.dir
    ? `<li><a href="${w.dir}/">${inner}</a></li>`
    : `<li class="soon"><span class="card">${inner}</span></li>`;
}).join('');
</script>
</body>
</html>
